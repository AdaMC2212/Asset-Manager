<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#060b16">
    <title>Offline | AssetManager</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #060b16; color: #eaf0ff; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 420px; }
      h1 { font-size: 28px; line-height: 1.2; }
      p { color: #b8c3db; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 8px; background: #4f7bff; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #27d18f; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.ico" width="40" height="40" alt="">
      <p>AssetManager</p>
      <h1>You're offline</h1>
      <p>Your balances and transactions are unavailable until you reconnect. No cached financial data is shown.</p>
      <a href="/">Try Again</a>
    </main>
  </body>
</html>
